<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos — Core ERP Almacén de Exportación</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../erp.css" />
</head>
<body>
  <div id="erpApp">
    <div class="page-header">
      <div>
        <div class="breadcrumb-erp"><b>Módulos</b> / Productos</div>
        <h1>Productos</h1>
      </div>
      <div class="filtros-bar">
        <div class="filtro-item">
          <label class="form-label-erp" for="inputBuscar">Buscar</label>
          <input type="text" id="inputBuscar" class="form-control form-control-sm" placeholder="Código o nombre…" style="min-width: 220px;" />
        </div>
        <div class="filtro-item">
          <label class="form-label-erp" for="checkSoloActivos">&nbsp;</label>
          <div class="form-check form-switch pt-1">
            <input class="form-check-input" type="checkbox" id="checkSoloActivos" checked />
            <label class="form-check-label" for="checkSoloActivos">Solo activos</label>
          </div>
        </div>
        <button type="button" id="btnNuevoProducto" class="btn btn-erp-primary btn-sm">
          <i class="bi bi-plus-lg me-1"></i>Nuevo producto
        </button>
      </div>
    </div>

    <div id="estadoError" class="alert alert-danger" style="display:none"></div>

    <div class="erp-card">
      <div class="card-header-erp"><i class="bi bi-box-seam me-1"></i>Catálogo de productos</div>
      <div class="table-responsive-erp">
        <table class="table-erp">
          <thead>
            <tr>
              <th>Código</th><th>Nombre</th><th>Unidad</th><th>Partida arancelaria</th>
              <th class="text-end">Stock mínimo</th><th>Estado</th>
              <th class="text-end">Stock</th><th class="text-end">Costo Unitario</th><th class="text-end">Valor Inventario</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyProductos"><tr><td colspan="10" class="text-muted-erp">Cargando…</td></tr></tbody>
        </table>
      </div>
      <div class="card-body-erp d-flex flex-wrap align-items-center justify-content-between gap-2 border-top">
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted-erp" id="paginacionResumen">&nbsp;</span>
          <select id="selectTamanioPagina" class="form-select form-select-sm" style="width:auto;">
            <option value="10">10 / página</option>
            <option value="25">25 / página</option>
            <option value="50">50 / página</option>
            <option value="9999">Todos</option>
          </select>
        </div>
        <nav aria-label="Paginación de productos">
          <ul class="pagination pagination-sm mb-0" id="paginacionControles"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Modal Nuevo/Editar producto -->
  <div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formProducto">
          <div class="modal-header">
            <h5 class="modal-title" id="modalProductoTitulo">Nuevo producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalProductoError" class="alert alert-danger" style="display:none"></div>
            <input type="hidden" id="campoId" />

            <div class="mb-2">
              <label class="form-label-erp" for="campoCodigo">Código</label>
              <input type="text" id="campoCodigo" class="form-control form-control-sm" maxlength="30" required minlength="1" />
            </div>
            <div class="mb-2">
              <label class="form-label-erp" for="campoNombre">Nombre</label>
              <input type="text" id="campoNombre" class="form-control form-control-sm" maxlength="150" required minlength="1" />
            </div>
            <div class="mb-2">
              <label class="form-label-erp" for="campoDescripcion">Descripción</label>
              <textarea id="campoDescripcion" class="form-control form-control-sm" rows="2" maxlength="500"></textarea>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label-erp" for="campoUnidad">Unidad de medida</label>
                <input type="text" id="campoUnidad" class="form-control form-control-sm" maxlength="20" placeholder="UND" />
              </div>
              <div class="col-6">
                <label class="form-label-erp" for="campoPartida">Partida arancelaria</label>
                <input type="text" id="campoPartida" class="form-control form-control-sm" maxlength="20" />
              </div>
            </div>
            <div class="mb-2">
              <label class="form-label-erp" for="campoStockMinimo">Stock mínimo</label>
              <input type="number" id="campoStockMinimo" class="form-control form-control-sm" min="0" step="0.01" />
            </div>
            <div class="mb-2 form-check form-switch" id="filaActivo" style="display:none">
              <input class="form-check-input" type="checkbox" id="campoActivo" />
              <label class="form-check-label" for="campoActivo">Activo</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-erp-primary btn-sm">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../auth.js"></script>
  <script src="../../api-client.js"></script>
  <script src="../../ui-components.js"></script>
  <script src="../../utils.js"></script>
  <script src="../../moneda-config.js"></script>
  <script src="../../layout.js"></script>
  <script src="productos.js"></script>
</body>
</html>
