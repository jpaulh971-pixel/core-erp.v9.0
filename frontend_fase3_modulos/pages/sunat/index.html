<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUNAT — Core ERP Almacén de Exportación</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../erp.css" />
</head>
<body>
  <div id="erpApp">
    <div class="page-header">
      <div>
        <div class="breadcrumb-erp"><b>Módulos</b> / SUNAT</div>
        <h1>Comprobantes electrónicos</h1>
      </div>
      <div class="filtros-bar">
        <div class="filtro-item">
          <label class="form-label-erp" for="selectEstado">Estado</label>
          <select id="selectEstado" class="form-select form-select-sm">
            <option value="">Todos</option>
            <option value="EMITIDO">Emitido</option>
            <option value="ACEPTADO">Aceptado</option>
            <option value="RECHAZADO">Rechazado</option>
            <option value="ANULADO">Anulado</option>
          </select>
        </div>
        <button type="button" id="btnNuevoComprobante" class="btn btn-erp-primary btn-sm">
          <i class="bi bi-plus-lg me-1"></i>Emitir comprobante
        </button>
      </div>
    </div>

    <div id="estadoError" class="alert alert-danger" style="display:none"></div>

    <div class="erp-card">
      <div class="card-header-erp"><i class="bi bi-file-earmark-text me-1"></i>Comprobantes emitidos</div>
      <div class="table-responsive-erp">
        <table class="table-erp">
          <thead>
            <tr>
              <th>N.º completo</th><th>Tipo</th><th>Cliente</th><th>Orden venta</th>
              <th class="text-end">Total</th><th>Estado</th><th>Emitido</th><th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyComprobantes"><tr><td colspan="8" class="text-muted-erp">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Emitir comprobante -->
  <div class="modal fade" id="modalNuevoComprobante" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formNuevoComprobante">
          <div class="modal-header">
            <h5 class="modal-title">Emitir comprobante</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalNuevoComprobanteError" class="alert alert-danger" style="display:none"></div>
            <p class="text-muted-erp" style="font-size:12.5px;">
              Solo se puede emitir un comprobante por cada orden de venta ya
              <b>DESPACHADA</b> (mercadería entregada), y solo una vez por orden.
            </p>
            <div class="mb-2">
              <label class="form-label-erp" for="comprobanteOrden">Orden de venta despachada</label>
              <select id="comprobanteOrden" class="form-select form-select-sm" required>
                <option value="">Seleccionar…</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label-erp" for="comprobanteTipo">Tipo de comprobante</label>
              <select id="comprobanteTipo" class="form-select form-select-sm" required>
                <option value="FACTURA">Factura (requiere RUC de 11 dígitos)</option>
                <option value="BOLETA">Boleta (requiere DNI de 8 dígitos o RUC)</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-erp-primary btn-sm">Emitir</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Detalle de comprobante -->
  <div class="modal fade" id="modalDetalleComprobante" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detalleComprobanteTitulo">Comprobante</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalDetalleComprobanteError" class="alert alert-danger" style="display:none"></div>
          <div class="row g-2" id="detalleComprobanteInfo"></div>

          <!-- Anular (inline, mismo modal) -->
          <div id="bloqueAnular" class="mt-3" style="display:none">
            <hr />
            <label class="form-label-erp" for="motivoAnulacion">Motivo de anulación</label>
            <textarea id="motivoAnulacion" class="form-control form-control-sm" rows="2" maxlength="300"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnMostrarAnular" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-x-lg me-1"></i>Anular comprobante
          </button>
          <button type="button" id="btnConfirmarAnular" class="btn btn-danger btn-sm" style="display:none">
            Confirmar anulación
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../auth.js"></script>
  <script src="../../api-client.js"></script>
  <script src="../../ui-components.js"></script>
  <script src="../../utils.js"></script>
  <script src="../../moneda-config.js"></script>
  <script src="../../layout.js"></script>
  <script src="sunat.js"></script>
</body>
</html>
