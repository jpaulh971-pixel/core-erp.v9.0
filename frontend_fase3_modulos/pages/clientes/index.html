<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes — Core ERP Almacén de Exportación</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../erp.css" />
</head>
<body>
  <div id="erpApp">
    <div class="page-header">
      <div>
        <div class="breadcrumb-erp"><b>Módulos</b> / Clientes</div>
        <h1>Clientes</h1>
      </div>
      <div class="filtros-bar">
        <div class="filtro-item">
          <label class="form-label-erp" for="inputBuscar">Buscar</label>
          <input type="text" id="inputBuscar" class="form-control form-control-sm" placeholder="RUC o razón social…" style="min-width: 220px;" />
        </div>
        <div class="filtro-item">
          <label class="form-label-erp" for="checkSoloActivos">&nbsp;</label>
          <div class="form-check form-switch pt-1">
            <input class="form-check-input" type="checkbox" id="checkSoloActivos" checked />
            <label class="form-check-label" for="checkSoloActivos">Solo activos</label>
          </div>
        </div>
        <button type="button" id="btnNuevoCliente" class="btn btn-erp-primary btn-sm">
          <i class="bi bi-plus-lg me-1"></i>Nuevo cliente
        </button>
      </div>
    </div>

    <div id="estadoError" class="alert alert-danger" style="display:none"></div>

    <div class="erp-card">
      <div class="card-header-erp"><i class="bi bi-people me-1"></i>Directorio de clientes</div>
      <div class="table-responsive-erp">
        <table class="table-erp">
          <thead>
            <tr>
              <th>RUC</th><th>Razón social</th><th>Contacto</th><th>Teléfono</th>
              <th>País</th><th>Estado</th><th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyClientes"><tr><td colspan="7" class="text-muted-erp">Cargando…</td></tr></tbody>
        </table>
      </div>
      <div class="card-body-erp d-flex flex-wrap align-items-center justify-content-between gap-2 border-top">
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted-erp" id="paginacionResumen">&nbsp;</span>
          <select id="selectTamanioPagina" class="form-select form-select-sm" style="width:auto;">
            <option value="10">10 / página</option>
            <option value="25">25 / página</option>
            <option value="50">50 / página</option>
            <option value="9999">Todos</option>
          </select>
        </div>
        <nav aria-label="Paginación de clientes">
          <ul class="pagination pagination-sm mb-0" id="paginacionControles"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Modal Nuevo/Editar cliente -->
  <div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formCliente">
          <div class="modal-header">
            <h5 class="modal-title" id="modalClienteTitulo">Nuevo cliente</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="modalClienteError" class="alert alert-danger" style="display:none"></div>
            <input type="hidden" id="campoId" />

            <div class="mb-2">
              <label class="form-label-erp" for="campoRuc">RUC</label>
              <input type="text" id="campoRuc" class="form-control form-control-sm" maxlength="20" pattern="[0-9]{11}" inputmode="numeric" title="El RUC debe tener 11 dígitos numéricos." required />
            </div>
            <div class="mb-2">
              <label class="form-label-erp" for="campoRazonSocial">Razón social</label>
              <input type="text" id="campoRazonSocial" class="form-control form-control-sm" maxlength="200" required minlength="1" />
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label-erp" for="campoContacto">Contacto</label>
                <input type="text" id="campoContacto" class="form-control form-control-sm" />
              </div>
              <div class="col-6">
                <label class="form-label-erp" for="campoTelefono">Teléfono</label>
                <input type="text" id="campoTelefono" class="form-control form-control-sm" />
              </div>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <label class="form-label-erp" for="campoEmail">Email</label>
                <input type="email" id="campoEmail" class="form-control form-control-sm" />
              </div>
              <div class="col-6">
                <label class="form-label-erp" for="campoPais">País</label>
                <input type="text" id="campoPais" class="form-control form-control-sm" />
              </div>
            </div>
            <div class="mb-2 form-check form-switch" id="filaActivo" style="display:none">
              <input class="form-check-input" type="checkbox" id="campoActivo" />
              <label class="form-check-label" for="campoActivo">Activo</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-erp-primary btn-sm">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../auth.js"></script>
  <script src="../../api-client.js"></script>
  <script src="../../ui-components.js"></script>
  <script src="../../utils.js"></script>
  <script src="../../moneda-config.js"></script>
  <script src="../../layout.js"></script>
  <script src="clientes.js"></script>
</body>
</html>
