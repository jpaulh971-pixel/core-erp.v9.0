<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración — Core ERP Almacén de Exportación</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../../erp.css" />

  <style>
    /* Estilos propios de esta página (KPI/diagnóstico), no cubiertos por
       erp.css: tarjetas de estado con etiqueta + valor grande, siguiendo
       el mismo criterio que login.html (bloque <style> propio de la
       página en vez de tocar erp.css). */
    .kpi-card { padding: 16px; }
    .kpi-label {
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--erp-text-muted); font-weight: 700;
    }
    .kpi-value { font-size: clamp(16px, 1.6vw, 24px); font-weight: 800; margin-top: 6px; line-height: 1.2; word-break: break-word; overflow-wrap: anywhere; }
    .kpi-sub { font-size: 12px; color: var(--erp-text-muted); margin-top: 4px; }
    .badge-ok { background: #e6f4ea; color: #1e7e34; }
    .badge-bad { background: #fdecec; color: #b3261e; }
    .badge-diag { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>
  <div id="erpApp">
    <div class="page-header">
      <div>
        <div class="breadcrumb-erp"><b>Sistema</b> / Configuración</div>
        <h1>Configuración</h1>
      </div>
    </div>

    <div id="estadoError" class="alert alert-danger" style="display:none"></div>

    <!-- Diagnóstico: Auth, token, API_BASE_URL -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="erp-card kpi-card">
          <div class="kpi-label"><i class="bi bi-hdd-network me-1"></i>Backend (API_BASE_URL)</div>
          <div class="kpi-value" id="kpiBaseUrl" style="font-size:15px;">—</div>
          <div class="kpi-sub"><span id="badgeBackend" class="badge-diag badge-ok">Verificando…</span></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="erp-card kpi-card">
          <div class="kpi-label"><i class="bi bi-key me-1"></i>Sesión / Token</div>
          <div class="kpi-value" id="kpiToken" style="font-size:15px;">—</div>
          <div class="kpi-sub"><span id="badgeToken" class="badge-diag badge-ok">Verificando…</span></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="erp-card kpi-card">
          <div class="kpi-label"><i class="bi bi-diagram-3 me-1"></i>Módulo m20_configuracion</div>
          <div class="kpi-value" id="kpiModulo" style="font-size:15px;">—</div>
          <div class="kpi-sub" id="kpiModuloSub">GET /api/configuracion/status</div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-lg-5">
        <div class="erp-card h-100">
          <div class="card-header-erp"><i class="bi bi-person-badge"></i>Cuenta actual</div>
          <div class="card-body-erp" id="cardUsuario">
            <div class="text-muted-erp">Cargando usuario…</div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="erp-card h-100">
          <div class="card-header-erp"><i class="bi bi-sliders"></i>Parámetros del sistema</div>
          <div class="card-body-erp p-0">
            <div class="table-responsive-erp">
              <table class="table-erp">
                <thead>
                  <tr>
                    <th>Clave</th>
                    <th>Valor</th>
                    <th>Descripción</th>
                  </tr>
                </thead>
                <tbody id="tbodyParametros">
                  <tr><td colspan="3" class="text-muted-erp">Cargando parámetros…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../auth.js"></script>
  <script src="../../api-client.js"></script>
  <script src="../../ui-components.js"></script>
  <script src="../../utils.js"></script>
  <script src="../../moneda-config.js"></script>
  <script src="../../layout.js"></script>
  <script src="configuracion.js"></script>
</body>
</html>
